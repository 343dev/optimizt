name: Node.js CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changes
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD" | grep -Eq '^packages/optimizt-(gifsicle|guetzli)/'; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Use Node.js
        if: steps.changes.outputs.required == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - if: steps.changes.outputs.required == 'true'
        run: npm ci
      - if: steps.changes.outputs.required == 'true'
        run: npm run provenance:setup
      - if: steps.changes.outputs.required == 'true'
        run: npm run provenance:verify

  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: [24.18.0, latest]
        os: [
            ubuntu-latest, # x64
            ubuntu-24.04-arm, # arm64
            macos-15-intel, # x64
            macos-15, # arm64
          ]
        include:
          - os: windows-latest
            node-version: 24.18.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Use Node.js ${{ matrix.node-version }} on ${{ matrix.os }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm ci
      - name: Validate packages
        run: npm run check
