name: Publish packages to npmjs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # Required for npm trusted publishing
  contents: read

jobs:
  publish_to_npm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "latest"
          registry-url: "https://registry.npmjs.org"
      - name: Install dependencies
        run: npm ci
      - name: Validate packages
        run: npm run check
      - name: Publish changed package
        run: |
          workspace=@343dev/optimizt
          current_version=$(npm pkg get version --workspace "$workspace" | node -p "Object.values(JSON.parse(require('node:fs').readFileSync(0, 'utf8')))[0]")
          if npm view "$workspace@$current_version" version >/dev/null 2>&1; then
            echo "$workspace@$current_version is already published"
            exit 0
          fi
          npm publish --workspace "$workspace" --access public --provenance
